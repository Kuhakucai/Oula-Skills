name: verified-dev-flow CI

on:
  push:
    paths:
      - 'verified-dev-flow/**'
      - '.github/workflows/verified-dev-flow-ci.yml'
  pull_request:
    paths:
      - 'verified-dev-flow/**'
      - '.github/workflows/verified-dev-flow-ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        run: |
          find verified-dev-flow -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

      - name: ShellCheck
        run: |
          find verified-dev-flow -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -S warning -e SC1090,SC1091,SC2034,SC2155

      - name: Functional tests
        run: bash verified-dev-flow/tests/verified-dev-flow-tests.sh
